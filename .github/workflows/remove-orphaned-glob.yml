name: Remove orphaned glob dependency

on:
  push:
    branches:
      - chore/remove-orphaned-glob

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove orphaned glob dependency
        run: npm uninstall glob --save-dev

      - name: Verify manifest and lockfile no longer reference glob directly
        run: |
          node -e "const p=require('./package.json'); if (p.devDependencies?.glob) process.exit(1);"
          node -e "const l=require('./package-lock.json'); if (l.packages?.['']?.devDependencies?.glob) process.exit(1);"

      - name: Remove temporary workflow and trigger
        run: rm -f .github/workflows/remove-orphaned-glob.yml .ci/remove-orphaned-glob-trigger.md

      - name: Commit dependency cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/remove-orphaned-glob.yml .ci/remove-orphaned-glob-trigger.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove orphaned glob dependency'
          git push