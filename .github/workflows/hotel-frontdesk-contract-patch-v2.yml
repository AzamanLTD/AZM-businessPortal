name: Hotel front desk contract patch v2

on:
  push:
    branches: [fix/hotel-frontdesk-customer-contract]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hotel-frontdesk-customer-contract
          fetch-depth: 1
      - name: Patch source
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/HotelFrontDesk.jsx')
          s = p.read_text()
          pairs = [
            ("guestName: '',\n    phone: '',", "customerAzamanId: '',\n    phone: '',"),
            ("if (!walkInForm.guestName || !walkInForm.roomId)", "if (!walkInForm.customerAzamanId || !walkInForm.roomId)"),
            ("guestName: walkInForm.guestName,", "customerAzamanId: walkInForm.customerAzamanId,"),
            ("guestName: '',\n        phone: '',", "customerAzamanId: '',\n        phone: ''"),
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit('missing required source pattern: ' + old)
              s = s.replace(old, new, 1)
          old = '''              label="Guest Full Name *"\n              required\n              placeholder="e.g. Alice Vance"\n              value={walkInForm.guestName}\n              onChange={(e) => setWalkInForm(prev => ({ ...prev, guestName: e.target.value }))}\n            />'''
          new = '''              label="Customer Azaman ID *"\n              required\n              placeholder="e.g. AZM-123456789"\n              value={walkInForm.customerAzamanId}\n              onChange={(e) => setWalkInForm(prev => ({ ...prev, customerAzamanId: e.target.value.trim().toUpperCase() }))}\n            />'''
          if old not in s:
              raise SystemExit('missing guest input block')
          s = s.replace(old, new, 1)
          p.write_text(s)
          Path('src/pages/HotelFrontDesk.contract.test.jsx').write_text('''import { describe, expect, it } from \'vitest\';\nimport { readFile } from \'node:fs/promises\';\n\nconst sourcePath = new URL(\'./HotelFrontDesk.jsx\', import.meta.url);\n\ndescribe(\'HotelFrontDesk walk-in customer identity contract\', () => {\n  it(\'uses the public Azaman customer identifier\', async () => {\n    const source = await readFile(sourcePath, \'utf8\');\n    expect(source).toContain(\'customerAzamanId: walkInForm.customerAzamanId\');\n    expect(source).toContain(\'label="Customer Azaman ID *"\');\n    expect(source).not.toContain(\'guestName: walkInForm.guestName\');\n  });\n});\n''')
          PY
          rm -f .github/workflows/hotel-frontdesk-contract-patch.yml .github/workflows/hotel-frontdesk-contract-patch-v2.yml
          git config user.name azaman-ci
          git config user.email azaman-ci@users.noreply.github.com
          git add -A
          git commit -m 'fix(hotel): align front desk walk-in identity contract'
          git push origin HEAD:fix/hotel-frontdesk-customer-contract
