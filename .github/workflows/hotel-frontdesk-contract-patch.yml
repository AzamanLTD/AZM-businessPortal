name: Hotel front desk contract patch

on:
  push:
    branches: [fix/hotel-frontdesk-customer-contract]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hotel-frontdesk-customer-contract
          fetch-depth: 1
      - name: Align walk-in form with customer identity contract
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/HotelFrontDesk.jsx')
          s = p.read_text()
          replacements = [
            ("  const [walkInForm, setWalkInForm] = useState({\n    guestName: '',", "  const [walkInForm, setWalkInForm] = useState({\n    customerAzamanId: '',"),
            ("    if (!walkInForm.guestName || !walkInForm.roomId) {", "    if (!walkInForm.customerAzamanId || !walkInForm.roomId) {"),
            ("          guestName: walkInForm.guestName,", "          customerAzamanId: walkInForm.customerAzamanId,"),
            ("        guestName: '',\n        phone: '',", "        customerAzamanId: '',\n        phone: '',"),
            ("              label=\"Guest Full Name *\"\n              required\n              placeholder=\"e.g. Alice Vance\"\n              value={walkInForm.guestName}\n              onChange={(e) => setWalkInForm(prev => ({ ...prev, guestName: e.target.value }))}\n            />", "              label=\"Customer Azaman ID *\"\n              required\n              placeholder=\"e.g. AZM-123456789\"\n              value={walkInForm.customerAzamanId}\n              onChange={(e) => setWalkInForm(prev => ({ ...prev, customerAzamanId: e.target.value.trim().toUpperCase() }))}\n              helperText=\"Use the guest's registered Azaman ID. No internal customer database ID is exposed.\"\n            />"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected source pattern: {old[:120]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          test = Path('src/pages/HotelFrontDesk.contract.test.jsx')
          test.write_text(r'''import { describe, expect, it } from 'vitest';
import { readFile } from 'node:fs/promises';

const sourcePath = new URL('./HotelFrontDesk.jsx', import.meta.url);

describe('HotelFrontDesk walk-in customer identity contract', () => {
  it('submits the public Azaman customer identifier and not an internal guest name', async () => {
    const source = await readFile(sourcePath, 'utf8');
    expect(source).toContain('customerAzamanId: walkInForm.customerAzamanId');
    expect(source).toContain('label="Customer Azaman ID *"');
    expect(source).not.toContain('guestName: walkInForm.guestName');
  });
});
''')

          p = Path('.github/workflows/hotel-frontdesk-contract-patch.yml')
          p.unlink()
          import subprocess
          subprocess.run(['git', 'config', 'user.name', 'azaman-automation'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'automation@azaman.local'], check=True)
          subprocess.run(['git', 'add', 'src/pages/HotelFrontDesk.jsx', 'src/pages/HotelFrontDesk.contract.test.jsx', '.github/workflows/hotel-frontdesk-contract-patch.yml'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(hotel): align front desk walk-in identity contract'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:fix/hotel-frontdesk-customer-contract'], check=True)
          PY
